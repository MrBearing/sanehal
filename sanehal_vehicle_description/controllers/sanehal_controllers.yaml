controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    sanehal_base_controller:
      type: diff_drive_controller/DiffDriveController

sanehal_base_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    # Nominal SANEHAL-2 geometry from sanehal.xacro.  Effective odometry
    # values must be calibrated on the assembled robot (Issue #25).
    wheel_separation: 0.2  # 2 * wheel_y_offset (wheel center distance)
    wheel_radius: 0.0395   # nominal 0.079 m wheel diameter

    # Keep calibration neutral here.  Motor direction is not a geometry
    # correction and is handled by the ros2_control transmission matrix.
    # 2026-08-24 floor calibration: physical 360 deg produced 366.23/368.14 deg
    # wheel odometry (left/right). Their mean gives 1.0201; use two decimals to
    # avoid encoding more precision than the manual heading measurement supports.
    wheel_separation_multiplier: 1.02
    left_wheel_radius_multiplier: 1.0
    # Motor mounting directions are handled by the ros2_control transmission matrix.
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    # diff_drive_controller is the sole owner of odom -> base_footprint.
    # robot_state_publisher owns base_footprint -> base_link and all child TFs.
    base_frame_id: base_footprint
    pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    # Use wheel position feedback exposed by dynamixel_hardware_interface for
    # odometry.  open_loop=true would integrate commanded velocity instead.
    open_loop: false
    enable_odom_tf: true

    cmd_vel_timeout: 0.5
    #publish_limited_velocity: true
    #velocity_rolling_window_size: 10

    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    # Conservative SANEHAL-2 limits for initial hardware validation.
    # Raise these only after wheel direction, braking, and odometry are verified.
    linear.x.max_velocity: 0.20
    linear.x.min_velocity: -0.20
    linear.x.max_acceleration: 0.20
    linear.x.min_acceleration: -0.20
    # NaN disables jerk limits in Jazzy without the deprecated has_jerk_limits flag.
    linear.x.max_jerk: .nan
    linear.x.min_jerk: .nan

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 0.5
    angular.z.min_acceleration: -0.5
    angular.z.max_jerk: .nan
    angular.z.min_jerk: .nan
