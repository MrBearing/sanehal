name: ci_jazzy

on:
  pull_request:
    branches:
      - "jazzy"

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    container:
      image: osrf/ros:${{ matrix.ros_distribution }}-desktop
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        ros_distribution: [jazzy]
    steps:
      - uses: actions/checkout@v3
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distribution }}
      # HesaiLidar_ROS_2.0 v2.0.12 uses these libraries but does not declare
      # them in its package.xml, so rosdep cannot install them for the driver.
      - name: Install Hesai driver system dependencies
        run: |
          apt-get update
          apt-get install -y libboost-all-dev libyaml-cpp-dev
      - name: Build and Test
        uses: ros-tooling/action-ros-ci@v0.3
        with:
          target-ros2-distro: ${{ matrix.ros_distribution }}
          import-token: ${{ secrets.GITHUB_TOKEN }}
          vcs-repo-file-url: build_depends.repos
          package-name: |
            sanehal
            sanehal_bringup
            sanehal_vehicle_description
